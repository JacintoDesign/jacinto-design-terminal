<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- terminal bezel -->
  <rect width="32" height="32" rx="7" fill="#060a06"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#33ff66" stroke-opacity="0.28" stroke-width="1"/>
  <!-- phosphor block "J": top bar, stem, left hook -->
  <g filter="url(#glow)" fill="none" stroke="#33ff66" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M9 8 H20 M16 8 V19 Q16 23.5 11.5 23.5 Q8 23.5 8 19.5"/>
  </g>
  <!-- block cursor -->
  <rect x="21" y="19.5" width="3.4" height="4.2" fill="#33ff66" filter="url(#glow)"/>
</svg>
