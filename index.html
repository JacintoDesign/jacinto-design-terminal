<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jacinto Design — jacinto.design [terminal]</title>
  <meta name="description" content="Senior Developer at CBC · Instructor at Zero to Mastery. A terminal-themed portfolio — type 'help' to get started." />
  <meta property="og:title" content="Jacinto Design — jacinto.design [terminal]" />
  <meta property="og:description" content="A green-phosphor terminal portfolio. Type commands to explore. Some commands aren't listed." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jacinto-design-terminal.vercel.app/" />
  <meta property="og:image" content="https://jacinto-design-terminal.vercel.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#050805" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <div class="bezel">
    <div class="crt" id="crt">
      <div class="screen" id="screen">
        <div id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>
        <div class="input-line" id="input-line" hidden>
          <label for="cmd" class="prompt" id="prompt-label">guest@jacinto.design:~$</label>
          <div class="input-wrap">
            <span class="ghost" id="ghost" aria-hidden="true"></span>
            <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal command input" />
            <span class="measure" id="measure" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="flicker" aria-hidden="true"></div>
    </div>
    <div class="chips" id="chips" hidden>
      <button data-cmd="help">help</button>
      <button data-cmd="about">about</button>
      <button data-cmd="work">work</button>
      <button data-cmd="skills">skills</button>
      <button data-cmd="contact">contact</button>
      <button data-cmd="clear">clear</button>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Jacinto Design</h1>
      <p>Senior Developer at CBC · Instructor at Zero to Mastery · Toronto, Canada.</p>
      <p>This portfolio is an interactive terminal and needs JavaScript. In the meantime:
        <a href="https://jacinto.design">jacinto.design</a> ·
        <a href="https://github.com/JacintoDesign">GitHub</a> ·
        <a href="mailto:contact@jacinto.design">contact@jacinto.design</a>
      </p>
    </div>
  </noscript>

  <script src="js/data.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
  <script src="js/terminal.js?v=6"></script>
</body>
</html>
